name: Deploy Star Mousse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 24
  FRONTEND_DIR: frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix ${{ env.FRONTEND_DIR }} --legacy-peer-deps
      - run: npm run check:json
      - run: npm run test:unit
      - run: npm run lint --prefix ${{ env.FRONTEND_DIR }}
      - run: npm run test --prefix ${{ env.FRONTEND_DIR }}

  deploy-frontend:
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefix ${{ env.FRONTEND_DIR }} --legacy-peer-deps
      - run: npm run build --prefix ${{ env.FRONTEND_DIR }}
      - name: Deploy frontend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: ${{ env.FRONTEND_DIR }}
          prod: true
          envs: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CHATBOT_API_URL=${{ secrets.VITE_CHATBOT_API_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
