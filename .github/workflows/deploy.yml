name: Deploy Star Mousse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  FRONTEND_DIR: frontend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix ${{ env.FRONTEND_DIR }} --legacy-peer-deps
      - run: npm run check:json
      - run: npm run test:unit
      - run: npm run lint --prefix ${{ env.FRONTEND_DIR }}
      - run: npm run test --prefix ${{ env.FRONTEND_DIR }}

  deploy-backend:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?GitHub secret RENDER_API_KEY is missing}"
          : "${RENDER_SERVICE_ID:?GitHub secret RENDER_BACKEND_SERVICE_ID is missing}"

          response_file=$(mktemp)
          trap 'rm -f "${response_file}"' EXIT
          http_code=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${COMMIT_SHA}\"}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          if [[ "${http_code}" != 201 && "${http_code}" != 202 ]]; then
            echo "Render rejected the deployment request (HTTP ${http_code})."
            jq -r '.message // .error // .code // "No additional details"' "${response_file}"
            exit 1
          fi
          response=$(cat "${response_file}")
          deploy_id=$(jq -r '.id // empty' <<<"${response}")
          if [[ -z "${deploy_id}" ]]; then
            echo "Render did not return a deployment ID."
            exit 1
          fi

          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              | jq -r '.status // empty')
            echo "Render deployment status: ${status}"
            case "${status}" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for the Render deployment."
          exit 1

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefix ${{ env.FRONTEND_DIR }} --legacy-peer-deps
      - run: npm run build --prefix ${{ env.FRONTEND_DIR }}
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ env.FRONTEND_DIR }}
          prod: true
          envs: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CHATBOT_API_URL=${{ secrets.VITE_CHATBOT_API_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
