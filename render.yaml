services:
  - type: web
    name: starmousse-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://site-star-mousse.vercel.app
      - key: CORS_ORIGINS
        value: https://site-star-mousse.vercel.app,https://www.site-star-mousse.vercel.app
      - key: ALLOW_NO_DB
        value: false
